# ═══════════════════════ EU PROGRAMI I DONATORI ═══════════════════════

# SERDA – Sarajevska regionalna razvojna agencija: provodi EU i donatorske programe
# za MSP (SPRING Challenge fond, E4EO...). Na stranici su uglavnom vijesti o projektima,
# a pozivi se pojavljuju nekoliko puta godišnje - zato duži prag "bez stavki".
- name: "SERDA – Novosti"
  tier: "EU i donatori"
  url: "https://serda.ba/bs/novosti"
  rss: false
  tihi_dani: 60

# Program SPRING (finansira Švedska; provode SERDA, EDA i Fondacija Mozaik):
# posebna stranica samo sa pozivima - grantovi za MSP, izvoznike, obrte i poduzetnike.
- name: "Program SPRING – Pozivi"
  tier: "EU i donatori"
  url: "https://spring.ba/bs/novosti/pozivi"
  link_obrazac: "/bs/novost/[^/]+/\\d+"
  tihi_dani: 90

