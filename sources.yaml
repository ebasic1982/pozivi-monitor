# Izvori za praćenje javnih poziva (MSP u FBiH) — verzija 3.3.2 (36 izvora)
# Skripta za svaki izvor prvo traži RSS, a ako ga nema čita HTML stranicu.
# Izvor se prvi put upisuje BEZ obavještenja (nema poplave starih poziva).
# "tier" služi samo za grupisanje u obavještenju.
#
# Opcije po izvoru:
#   mode: context       = naslov poziva nije u samom linku, nego pored njega (traži se u redu)
#   link_obrazac: "..." = prihvata svaki link čija adresa odgovara obrascu (za agregatore
#                          čiji naslovi ne sadrže naše ključne riječi, npr. na engleskom)
#   poznat_kvar: true   = izvor trenutno ne radi i to već znamo -> bez upozorenja,
#                          ali kad proradi, stiže obavještenje o oporavku
#   tihi_dani: N        = poseban prag (u danima) za upozorenje "bez stavki", za izvore
#                          koji prirodno znaju dugo nemati nijedan poziv
#   health: false       = potpuno isključuje praćenje ispravnosti za taj izvor


